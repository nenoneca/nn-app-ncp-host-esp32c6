# ESP32-C6 NCP Host — Milestone A
#
# Minimal config: shell on USB-JTAG, UART1 driver for Spinel link to NCP,
# no OpenThread (custom NCP client replaces CONFIG_NET_L2_OPENTHREAD).
# WiFi enable comes in Milestone C.

# Shell / Console
CONFIG_SHELL=y
CONFIG_SHELL_STACK_SIZE=4096
CONFIG_SHELL_PROMPT_UART="ncphost:~$ "
# Shell is kept for SHELL_CMD registration (many code paths use it),
# but the serial backend is disabled so stray bytes from pyserial
# churn can't trigger the shell_start / common_beginning_find crashes
# documented in feedback_zephyr_shell_tab_crash.md.  The host now
# does its bring-up autonomously from main() — no interactive shell
# needed.  Re-enable for development if you need CLI access.
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_SHELL_TAB=n
# Long `provision set ...` lines (130-char hub_pubkey hex) overflow the
# default 64-byte RX ring; bump both the ring and the line buffer.
CONFIG_SHELL_BACKEND_SERIAL_RX_RING_BUFFER_SIZE=1024
CONFIG_SHELL_CMD_BUFF_SIZE=512
CONFIG_GPIO=y
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_EARLY_CONSOLE=y
CONFIG_LOG=y
CONFIG_LOG_MAX_LEVEL=4
# LOG_MODE_IMMEDIATE blocks the calling thread on UART for every log
# line.  With BLE active, that synchronous write starves the LL of
# CPU and triggers supervision timeout (reason 0x08) during the M6
# ECIES decrypt window.  Deferred mode hands log rendering to a
# dedicated thread so the BT stack stays responsive.
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_BACKEND_UART=y
CONFIG_PRINTK=y
CONFIG_BOOT_BANNER=y

# RNG for WPA2
CONFIG_TEST_RANDOM_GENERATOR=y
CONFIG_ENTROPY_GENERATOR=y

# Zephyr networking — Thread-over-Spinel iface (DUMMY_L2) and WiFi STA.
CONFIG_NETWORKING=y
CONFIG_NET_IPV6=y
CONFIG_NET_IPV4=y
CONFIG_NET_DHCPV4=y
CONFIG_NET_UDP=y
CONFIG_NET_TCP=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_SOCKETS_INET_RAW=y
CONFIG_NET_ICMPV4_ACCEPT_BROADCAST=y
CONFIG_NET_L2_DUMMY=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_MGMT_EVENT_INFO=y

# === WiFi (ESP32-C6 built-in, for IPv4 egress + NAT64) ===
CONFIG_WIFI=y
CONFIG_NET_L2_WIFI_SHELL=y
CONFIG_ESP32_WIFI_STA_AUTO_DHCPV4=y
# Driver-level reconnect: when the AP drops us (signal, deauth, lease loss),
# the ESP32 WiFi driver re-issues esp_wifi_connect() in the disconnect path
# instead of going DISCONNECTED-forever.  Without this, our one-shot
# auto_wifi_connect() at boot never re-fires and the gateway is stranded.
CONFIG_ESP32_WIFI_STA_RECONNECT=y
# Bump the umbrella WIFI log level to DEBUG temporarily so disconnect
# reasons (logged via LOG_DBG inside esp_wifi_handle_sta_disconnect_event)
# show up in the boot log.  Useful while diagnosing AP-association
# flakiness; lower to INF once the WiFi stack is stable.
CONFIG_WIFI_LOG_LEVEL_DBG=y
CONFIG_DNS_RESOLVER=y

# mDNS responder — publishes services on wlan0 for laptops to discover.
CONFIG_NET_HOSTNAME_ENABLE=y
CONFIG_NET_HOSTNAME="nn-br"
CONFIG_DNS_SD=y
CONFIG_MDNS_RESPONDER=y
CONFIG_MDNS_RESPONDER_DNS_SD=y
CONFIG_MDNS_RESPONDER_LOG_LEVEL_INF=y
CONFIG_DNS_SD_LOG_LEVEL_INF=y
CONFIG_NET_IPV4_IGMP=y
CONFIG_ZVFS_POLL_MAX=16

# Buffers for STREAM_NET packets (MTU 1280).
# Host is middleman for ALL Thread traffic — bump up vs sensor since
# MLE, data, and NAT64 traffic all flow through ncp_netif_rx_stream_net
# and each needs a net_pkt from the pool.  With 8/8 the pool was
# exhausted during OTA download ("rx drop: pkt alloc failed").
#
# 2026-05-03: TX side bumped 16/32 → 32/64 to keep STREAM_NET sends
# (Thread mesh traffic forwarded to NCP via Spinel) from being starved
# by HTTP TCP ACK/window-update bursts during NCP OTA downloads.
# Symptom of starvation: ncp_ota_relay block timeouts (rv=-116) +
# `esp32_wifi: Failed to allocate net buffer` + STREAM_NET tx drops.
CONFIG_NET_PKT_RX_COUNT=48
CONFIG_NET_PKT_TX_COUNT=48
CONFIG_NET_BUF_RX_COUNT=96
CONFIG_NET_BUF_TX_COUNT=96
CONFIG_NET_BUF_DATA_SIZE=256

# Network shell for `net iface`, `net route`, etc.
CONFIG_NET_SHELL=y
CONFIG_NET_ROUTING=y
CONFIG_NET_IPV6_NBR_CACHE=y
# NET_MAX_ROUTES + NET_MAX_NEXTHOPS removed for UART-silence bisect.
# Both were added in 2026-04-26 BR-routing work; reintroduce later.
CONFIG_NET_MAX_CONTEXTS=32
# Default NET_MAX_CONN=8 is exhausted by mDNS (×4: v4+v6 on wlan0+dummy0)
# + BorderAgent UDP + NAT64 + proto_udp.  Bump it so TCP connect() can
# allocate its conn handler.  Symptom of running out: socket calls fail
# immediately with errno=2 (ENOENT).
CONFIG_NET_MAX_CONN=24

# Room for mirroring multiple NCP IPv6 addresses/prefixes on the Thread iface.
CONFIG_NET_IF_UNICAST_IPV6_ADDR_COUNT=8
CONFIG_NET_IF_MCAST_IPV6_ADDR_COUNT=6
CONFIG_NET_IF_IPV6_PREFIX_COUNT=4
# Need ≥2 IPv6 contexts: one for wlan0, one for the Thread-over-Spinel iface.
# Default 1 leaves the Thread iface with "IPv6 not enabled" and all
# net_if_ipv6_addr_add calls fail.
CONFIG_NET_IF_MAX_IPV6_COUNT=2
CONFIG_NET_IF_MAX_IPV4_COUNT=2

# Stack sizes
CONFIG_MAIN_STACK_SIZE=5200
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_NET_TX_STACK_SIZE=2048
CONFIG_NET_RX_STACK_SIZE=2048
CONFIG_NET_MGMT_EVENT_STACK_SIZE=4096
CONFIG_NET_MGMT_EVENT_QUEUE_SIZE=16
CONFIG_NET_MGMT_EVENT_QUEUE_TIMEOUT=5000

# Flash / NVS (WiFi credentials, settings)
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y

# `provision set ...` ends with sys_reboot() to apply cleanly.
CONFIG_REBOOT=y

# Gateway OTA: MCUboot image manager + stream flash for HTTP downloads.
CONFIG_BOOTLOADER_MCUBOOT=y
CONFIG_IMG_MANAGER=y
CONFIG_STREAM_FLASH=y
CONFIG_STREAM_FLASH_ERASE=y
CONFIG_IMG_BLOCK_BUF_SIZE=1024
CONFIG_MCUBOOT_IMG_MANAGER=y

# Task watchdog: forces a reset if the new image deadlocks long enough
# for MCUboot to revert to slot0.  Heartbeat thread feeds the channel.
# DISABLED — both task_wdt_init(NULL) and task_wdt_init(wdt0) boot-loop
# on this Zephyr+espressif build (chip resets before reaching the
# Zephyr banner), even though the underlying wdt_esp32 driver passes
# samples/drivers/watchdog cleanly.  The bug is in the task_wdt
# framework integration, not the peripheral.  Code in gw_watchdog.c
# is scaffolded with HW-backed init ready (DEVICE_DT_GET(wdt0)) for
# when the framework issue is diagnosed.  Set both =y to enable.
# CONFIG_WATCHDOG=y
# CONFIG_TASK_WDT=y

# === nn_proto gateway identity (Ed25519) ===
# PSA Ed25519 + SHA-256 selectors are pulled in by NN_PROTO_KEYSTORE_DEPS
# (modules/libs/nn_proto/Kconfig).  mbedTLS itself is enabled by other
# parts of the stack already; only the heap size is tuned here.
# M6 ECIES decrypt is heap-hungry (mbedTLS bignum for X25519 ECDH).
# 32 KB has headroom for ECDH + HKDF + AES-GCM.
CONFIG_MBEDTLS_HEAP_SIZE=32768

# hub_crypto serialises ECIES envelopes as JSON with base64 payloads,
# matching the on-device path used by sensors.
CONFIG_BASE64=y
CONFIG_JSON_LIBRARY=y

# Bumped heap for WiFi / wpa_supplicant + M6 ECIES PSA crypto path.
CONFIG_HEAP_MEM_POOL_SIZE=65536

# === BLE (M1 — provisioning bring-up) ===
# Peripheral-only.  Hub-side CLI is the central; the gateway never
# connects out.  Brought up by gw_ble_provision_start() if the gateway
# is not provisioned (first-boot flow).  See plan at
# /home/chalos/.claude/plans/gateway-ble-provisioning.md
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
# Needed so the peripheral can call bt_gatt_exchange_mtu() on connect.
# BlueZ central does NOT auto-do ATT MTU exchange — without this the
# ATT MTU stays at the spec default 23, forcing every M6 ECIES write
# (110-170 B) into Write Long which the prepare-buffers fail.
CONFIG_BT_GATT_CLIENT=y
CONFIG_BT_DEVICE_NAME="nn-gw"
CONFIG_BT_DEVICE_NAME_DYNAMIC=y
CONFIG_BT_DEVICE_NAME_MAX=16
CONFIG_BT_MAX_CONN=1
CONFIG_BT_L2CAP_TX_MTU=260
CONFIG_BT_BUF_ACL_RX_SIZE=264
CONFIG_BT_BUF_ACL_TX_SIZE=264
# M6: ECIES envelope writes can be up to ~190B; if BlueZ on the central
# falls back to Write Long (prepare/execute) we need enough prepare
# slots to accept the fragments.  16 covers our biggest envelope at
# default ATT MTU (23).
CONFIG_BT_ATT_PREPARE_COUNT=16
# PSA ECDH+HKDF+AES-GCM in the GATT write callback eats stack; bump
# to 16 KB so a M6 ECIES decrypt from the BT RX thread (P-256 ECDH on
# a real peer-supplied curve point) doesn't overflow.  ECDH alone uses
# >4 KB of stack on this mbedTLS build.
CONFIG_BT_RX_STACK_SIZE=16384
CONFIG_BT_LONG_WQ_STACK_SIZE=8192
CONFIG_BT_SETTINGS=n
CONFIG_BT_LOG_LEVEL_INF=y
CONFIG_BT_HCI_DRIVER_LOG_LEVEL_WRN=y

# === M6: application-layer ECIES on provisioning writes ===
# Instead of relying on BLE link-layer encryption (Just Works pairing
# could not be made to work reliably with BlueZ across all the
# bondable/SC/IO-capability permutations — see
# feedback_zephyr_smp_sc_only_just_works.md), we encrypt the
# provisioning payloads at the application layer using ECIES with
# the gateway's P-256 keypair.
#
# Wire format per encrypted GATT char:
#   [65B eph P-256 pub][12B nonce][N+16B AES-GCM-256 ciphertext+tag]
#   AAD = eph_pub.  Shared key = HKDF-SHA256(
#     ECDH(eph_priv, gw_static_pub) , salt=eph_pub,
#     info="nn-gw-prov-v1", L=32).
# The hub reads the gateway's P-256 pub from GW_INFO (plaintext, OK —
# it's a public key) and uses it to encrypt each write.
#
# SMP/pairing config kept off: link is unencrypted but every byte the
# operator cares about (WiFi PSK, hub privkey-derived hub_id, hub pub)
# travels inside a fresh AES-GCM envelope.  COMMIT and GW_INFO stay
# plaintext (no secrets there).

# Call-trace on fatal exception.
CONFIG_EXCEPTION_STACK_TRACE=y
CONFIG_THREAD_STACK_INFO=y
CONFIG_EXTRA_EXCEPTION_INFO=y

# We are NOT bringing in Zephyr's OpenThread stack on this host; all OT
# logic lives on the paired NCP chip.  The Spinel client is implemented
# from scratch in src/ (hdlc.c, spinel.c, ncp_link.c).
#
# Explicit negatives (defensive — these would conflict with our driver):
# CONFIG_NET_L2_OPENTHREAD is not set
# CONFIG_HDLC_RCP_IF is not set
# CONFIG_IEEE802154 is not set

# On-board WS2812 RGB LED (GPIO 8) for visual chip identification.
# Host firmware turns it RED on boot; NCP firmware turns it GREEN.
CONFIG_SPI=y
CONFIG_LED_STRIP=y
CONFIG_WS2812_STRIP_SPI=y
CONFIG_FW_COMMON=y
CONFIG_NN_PAL=y
